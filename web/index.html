<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wolfenstein: Enemy Territory</title>
  <link rel="icon" href="/img/et.png" type="image/png">
  <link rel="preload" href="/fonts/ModernDOS8x16.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/css/etjs.css?v=10">
</head>
<body>
  <div id="name-gate">
    <form id="name-form" class="gate-card" autocomplete="on">
      <img id="et-icon" src="/img/et.png" width="64" height="64" alt="Wolfenstein: Enemy Territory">
      <p class="game-kicker">Wolfenstein</p>
      <h1>Enemy Territory</h1>
      <p>Enter a player name to start the game.</p>
      <label for="player-name">Player name</label>
      <input id="player-name" name="player-name" type="text" maxlength="32" autocomplete="nickname" spellcheck="false" autofocus>
      <details class="advanced-settings">
        <summary>Advanced settings</summary>
        <label for="graphics-profile">Graphics profile</label>
        <select id="graphics-profile" name="graphics-profile">
          <option value="3">Maximum</option>
          <option value="2">Balanced</option>
          <option value="1">Performance</option>
          <option value="0">Minimum</option>
        </select>
        <div class="dynamic-settings-row">
          <label class="toggle-setting" for="dynamic-quality">
            <input id="dynamic-quality" name="dynamic-quality" type="checkbox" checked>
            <span>Dynamic quality</span>
          </label>
          <label class="fps-setting" for="dynamic-fps">
            <span>Target</span>
            <select id="dynamic-fps" name="dynamic-fps">
              <option value="30">30 FPS</option>
              <option value="60" selected>60 FPS</option>
              <option value="120">120 FPS</option>
            </select>
          </label>
        </div>
        <p class="setting-help">Dynamic quality adjusts live effects without restarting the renderer or exceeding the selected profile.</p>
      </details>
      <button type="submit" id="name-submit">Play</button>
      <p id="name-error" class="gate-error"></p>
    </form>
  </div>

  <div id="load-panel" class="hidden" aria-live="polite">
    <div class="gate-card load-card">
      <img class="et-icon-sm" src="/img/et.png" width="32" height="32" alt="">
      <h1>ET Console</h1>
      <p id="load-status">Preparing official game data…</p>
      <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="load-bar-fill"></div>
      </div>
      <p id="load-detail" class="load-detail"></p>
      <div id="startup-console" class="startup-console" role="log" aria-label="Enemy Territory startup output"></div>
    </div>
  </div>

  <audio id="menu-music" loop preload="auto" src="/sound/music/menu_server.wav"></audio>

  <div id="viewport-frame" class="hidden">
    <canvas id="et-canvas" width="1024" height="768" tabindex="0"></canvas>
  </div>

  <script src="/js/player-name.js?v=2"></script>
  <script src="/js/etjs-input.js?v=3"></script>
  <script src="/js/bind-store.js?v=2"></script>
  <script src="/js/pk3-cache.js?v=3"></script>
  <script src="/js/pk3-download.js?v=1"></script>
  <script src="/js/client.js?v=16"></script>
</body>
</html>
