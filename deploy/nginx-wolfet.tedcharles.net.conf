# Remote nginx box only. Do not install nginx on the game laptop.
# Path: wolfet.tedcharles.net -> CNAME tedroddy.ddns.net -> this host -> 4.20.69.92:8088
#
# Cloudflare free orange-cloud caps downloads at 100MB. pak0.pk3 is ~228MB.
# Grey-cloud the hostname, or bypass Cloudflare for /etmain/*.pk3, or first-load fails.
#
# TLS terminates here (Let's Encrypt). The laptop serves plain HTTP + WS on :8088.

upstream etjs_laptop {
    server 4.20.69.92:8088;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wolfet.tedcharles.net;

    # ssl_certificate / ssl_certificate_key — already on this box via Let's Encrypt

    client_max_body_size 300m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /ws {
        proxy_pass http://etjs_laptop;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://etjs_laptop;
        proxy_set_header Connection "";
    }

    types {
        application/wasm wasm;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name wolfet.tedcharles.net;
    return 301 https://$host$request_uri;
}
